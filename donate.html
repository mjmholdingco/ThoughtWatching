<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Donate | THOUGHT WATCHING</title>

<link rel="stylesheet" href="styles.css">

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* Minimal donation styling layered on top of your main CSS */

.donate-wrap {
  max-width: 900px;
  margin: 0 auto;
  padding: 60px 20px;
  display: flex;
  flex-direction: column;
  gap: 30px;
}

.crypto-card {
  border: 1px solid rgba(0,0,0,0.08);
  padding: 25px;
  background: transparent;
}

.crypto-title {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 8px;
  letter-spacing: 0.5px;
}

.crypto-address {
  font-family: monospace;
  font-size: 14px;
  opacity: 0.7;
  margin-bottom: 15px;
  word-break: break-all;
}

.copy-btn {
  background: none;
  border: 1px solid rgba(0,0,0,0.2);
  padding: 8px 14px;
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s ease;
}

.copy-btn:hover {
  background: black;
  color: white;
}
</style>

</head>

<body>

<header>
  <div class="nav">
    <div class="logo">THOUGHT WATCHING</div>

 <div class="links">
      <a href="index.html">Art</a>
      <a href="#">Thoughts</a>
      <a href="#">Submission</a>
      <a href="donate.html">Donate</a>
    </div>

    <div class="search">
    
    </div>
  </div>
</header>

<section class="hero">
  <h1>Support the Gallery</h1>
  <p>A quiet contribution keeps the archive alive.</p>
</section>

<main>

<div class="donate-wrap">

  <div class="crypto-card">
    <div class="crypto-title">Bitcoin (BTC)</div>
    <div class="crypto-address" id="btc">bc1qfakebitcoinaddress123456789</div>
    <button class="copy-btn" onclick="copyText('btc')">Copy Address</button>
  </div>

  <div class="crypto-card">
    <div class="crypto-title">Ethereum (ETH)</div>
    <div class="crypto-address" id="eth">0xFakeEthereumAddress123456789</div>
    <button class="copy-btn" onclick="copyText('eth')">Copy Address</button>
  </div>

  <div class="crypto-card">
    <div class="crypto-title">Litecoin (LTC)</div>
    <div class="crypto-address" id="ltc">LTCFakeAddress123456789</div>
    <button class="copy-btn" onclick="copyText('ltc')">Copy Address</button>
  </div>

</div>

</main>

<script>
function copyText(id) {
  const text = document.getElementById(id).innerText;
  navigator.clipboard.writeText(text);

  const btn = event.target;
  btn.innerText = "Copied";

  setTimeout(() => {
    btn.innerText = "Copy Address";
  }, 1200);
}
</script>

</body>
</html>
